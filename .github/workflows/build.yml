name: Compilar Cidade Grau Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: dulvuii/setup-godot@v4
        with:
          version: "4.3"

      - name: Baixar template Android
        run: godot --headless --import --quit

      - name: Exportar para Android
        run: |
          godot --headless --export-release-path "Android" "CidadeGrau.apk"

